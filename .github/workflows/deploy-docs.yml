name: Publish Documentation

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout index repository
        run: |
          git clone --depth 1 https://x-access-token:${{ secrets.INDEX_REPO_TOKEN }}@github.com/jacobcxdev/jacobcxdev.github.io.git action-checkout

      - name: Build documentation
        env:
          VITEPRESS_BASE: /repo/${{ github.repository_id }}/${{ github.ref_type == 'tag' && 'tag' || 'tree' }}/${{ github.ref_name }}/
        run: npm run docs:build

      - name: Publish to index
        uses: ./action-checkout/actions/publish-docs
        with:
          token: ${{ secrets.INDEX_REPO_TOKEN }}
          build-command: VITEPRESS_BASE=/repo/${{ github.repository_id }}/${{ github.ref_type == 'tag' && 'tag' || 'tree' }}/${{ github.ref_name }}/ npm run docs:build
          output-dir: docs/.vitepress/dist
          stable-branch: main
